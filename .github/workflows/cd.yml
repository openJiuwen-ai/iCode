name: CD
run-name: "CD — ${{ inputs.ref || 'main' }} (${{ inputs.platform || 'all' }})"

# Only dispatched: tag-release dispatches each release on the tag it creates.
# The GitCode→GitHub mirror pushes that tag again once it is also created on
# GitCode, and a tag-push trigger would rebuild the whole release from that.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build (default: main)'
        type: string
        default: main
      platform:
        description: 'Platform to build'
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux

concurrency:
  group: cd-${{ inputs.ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYAPP_VERSION: "0.29.0"
  # The binaries ship the CPython version .python-version pins (the one CI
  # tests on), built by this python-build-standalone release. Bump the two
  # together, and with scripts/build.sh and scripts/build.ps1.
  PYTHON_BUILD_STANDALONE_RELEASE: "20261026"

jobs:
  # ── Run CI checks first ─────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      build_ref: ${{ inputs.ref || github.ref }}

  # ── Build Python wheel ──────────────────────────────────────────────
  build-wheel:
    name: Build wheel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          enable-cache: true
          prune-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - name: Fetch ripgrep binaries (all platforms)
        run: ./scripts/fetch_rg.sh --all
      - run: uv build --wheel
      - name: Check the release tag names the wheel's version
        # A release uploads this wheel to PyPI under the version it carries and
        # creates the GitHub release under the tag, so the two must agree
        # before either happens.
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v')
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && "$TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::this run is on the tag ${GITHUB_REF_NAME} but builds ${TAG}"
            exit 1
          fi
          wheel=$(basename dist/icode_tui-*.whl)
          version="${wheel#icode_tui-}"
          version="${version%%-*}"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::this release builds ${TAG}, but the wheel's version is ${version}: release the tag v${version}"
            exit 1
          fi
      - name: Install and run the wheel as a PyPI user would
        run: python scripts/check_wheel.py --all-ripgrep dist/icode_tui-*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl

  # ── Compute build matrix (filter by platform input) ─────────────────
  compute-matrix:
    name: Compute build matrix
    runs-on: ubuntu-latest
    needs: build-wheel
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - id: filter
        shell: bash
        run: |
          platform="${{ inputs.platform || 'all' }}"
          # The macOS x86_64 leg runs on a native Intel runner rather than
          # cross-compiling from arm64: the offline flavor has to pip-install
          # (and occasionally compile) x86_64 wheels for the bundled interpreter.
          # Windows on Arm builds natively on windows-11-arm for the same reason.
          # AIxCoding branding: release command artifacts
          all_targets='[
            {"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","artifact":"aixcoding-cli-linux-x86_64","platform":"linux"},
            {"target":"aarch64-unknown-linux-musl","os":"ubuntu-24.04-arm","artifact":"aixcoding-cli-linux-aarch64","platform":"linux","glibc_floor":"2.18"},
            {"target":"aarch64-apple-darwin","os":"macos-latest","artifact":"aixcoding-cli-macos-aarch64","platform":"macos"},
            {"target":"x86_64-apple-darwin","os":"macos-15-intel","artifact":"aixcoding-cli-macos-x86_64","platform":"macos"},
            {"target":"x86_64-pc-windows-msvc","os":"windows-latest","artifact":"aixcoding-cli-windows-x86_64.exe","platform":"windows"},
            {"target":"aarch64-pc-windows-msvc","os":"windows-11-arm","artifact":"aixcoding-cli-windows-aarch64.exe","platform":"windows"}
          ]'
          if [ "$platform" = "all" ]; then
            filtered="$all_targets"
          else
            filtered=$(echo "$all_targets" | jq -c "[.[] | select(.platform == \"$platform\")]")
          fi
          targets=$(echo "$filtered" | jq -c '[.[].target]')
          # "offline" bundles every dependency into the binary. The "pip" and
          # "uv" flavors install from PyPI on first run; add them here to build
          # them alongside, e.g. ["offline","pip"].
          matrix=$(jq -nc --argjson targets "$targets" --argjson include "$filtered" \
            '{"installer":["offline"],"target":$targets,"include":$include}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ── Build PyApp binaries (6 platforms × 1 flavor = 6 jobs) ──────────
  build-binaries:
    name: ${{ matrix.artifact }}-${{ matrix.installer }}
    needs: compute-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      # Checked out into a subdirectory: PyApp's source is unpacked over the
      # workspace root below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: repo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: wheel

      - name: Determine version
        shell: bash
        run: |
          ref="${{ inputs.ref || '' }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PROJECT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$ref" == v* ]]; then
            echo "PROJECT_VERSION=${ref#v}" >> "$GITHUB_ENV"
          else
            # Dev build: derive base version from the wheel filename
            # (e.g. icode_tui-0.6.6-py3-none-any.whl -> 0.6.6) so dev artifacts
            # carry a meaningful version like v0.6.6-dev-abc1234. We use '-'
            # instead of PEP 440's '+' so the version is URL/filename-safe.
            base=$(ls wheel/*.whl | head -1 | sed -E 's|.*/icode_tui-([^-]+)-.*|\1|')
            base="${base:-0.0.0}"
            echo "PROJECT_VERSION=${base}-dev-$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_ENV"
          fi

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl') && !matrix.use-cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # The main line requires `toolchain` explicitly; only the `stable`
          # branch defaulted it, and that branch is not what we pin to.
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # Same as above: the `cross` branch defaulted this input, the main
          # line marks it required.
          tool: cross

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          enable-cache: true
          prune-cache: true

      - name: Prepare PyApp source
        shell: bash
        run: |
          curl -fsSL "https://github.com/ofek/pyapp/releases/download/v${PYAPP_VERSION}/source.tar.gz" | tar xz
          mv pyapp-v${PYAPP_VERSION}/* .
          mv pyapp-v${PYAPP_VERSION}/.* . 2>/dev/null || true
          cp wheel/*.whl .
          # Tolerate non-UTF-8 subprocess output (fixes non-English Windows)
          perl -i -pe '
            s/let mut output = String::new\(\);/let mut raw = Vec::new();/;
            s/reader\.read_to_string\(\&mut output\)\?;/reader.read_to_end(\&mut raw)?;/;
            s/Ok\(\(result\?, output\)\)/let output = String::from_utf8_lossy(\&raw).into_owned();\n    Ok((result?, output))/;
          ' src/process.rs
          if [[ "${{ matrix.platform }}" == "windows" || "${{ matrix.platform }}" == "macos" || "${{ matrix.platform }}" == "linux" ]]; then
            # PyApp launches Chrys by spawning the unpacked Python executable.
            # On Windows, macOS, and Linux, process-name cleanup tools can
            # still match that interpreter name, so run Chrys through a
            # sibling alias.
            perl -0pi -e '
              s/pub fn pythonw_path\(\) -> PathBuf \{\n    install_dir\(\)\.join\(installation_pythonw_path\(\)\)\n\}/pub fn pythonw_path() -> PathBuf {\n    install_dir().join(installation_pythonw_path())\n}\n\n#[cfg(windows)]\npub const CHRYS_RUNTIME_EXE: \&str = "chrys-runtime.exe";\n\n#[cfg(any(target_os = "macos", target_os = "linux"))]\npub const CHRYS_RUNTIME_EXE: \&str = "chrys-runtime";\n\n#[cfg(windows)]\npub const CHRYS_RUNTIMEW_EXE: \&str = "chrys-runtimew.exe";\n\n#[cfg(any(windows, target_os = "macos", target_os = "linux"))]\nfn renamed_python_path(original: PathBuf, alias: \&str) -> PathBuf {\n    if let Some(path) = original.parent().map(|parent| parent.join(alias)) {\n        if path.is_file() {\n            return path;\n        }\n        if cfg!(debug_assertions) {\n            eprintln!(\n                "Chrys runtime alias {} is missing; falling back to {}",\n                path.display(),\n                original.display()\n            );\n        }\n    }\n    original\n}\n\n#[cfg(any(windows, target_os = "macos", target_os = "linux"))]\npub fn runtime_python_path() -> PathBuf {\n    renamed_python_path(python_path(), CHRYS_RUNTIME_EXE)\n}\n\n#[cfg(not(any(windows, target_os = "macos", target_os = "linux")))]\npub fn runtime_python_path() -> PathBuf {\n    python_path()\n}\n\n#[cfg(windows)]\npub fn runtime_pythonw_path() -> PathBuf {\n    renamed_python_path(pythonw_path(), CHRYS_RUNTIMEW_EXE)\n}/;
            ' src/app.rs
            perl -0pi -e '
              s/\npub fn run_project\(\) -> Result<\(\)> \{\n    let mut command = python_command\(\&app::python_path\(\)\);\n\n    #\[cfg\(windows\)\]\n    \{\n        if app::is_gui\(\) \{\n            command = python_command\(\&app::pythonw_path\(\)\);\n        \}\n    \}/\n#[cfg(any(windows, target_os = "macos", target_os = "linux"))]\nfn link_or_copy_file(source: \&Path, target: \&Path) -> Result<()> {\n    if target.is_file() {\n        return Ok(());\n    }\n    fs::hard_link(source, target)\n        .or_else(|_| fs::copy(source, target).map(|_| ()))\n        .with_context(|| {\n            format!(\n                "unable to create Chrys runtime alias {} from {}",\n                \&target.display(),\n                \&source.display()\n            )\n        })\n}\n\n#[cfg(windows)]\nfn source_pth_path(source: \&Path) -> Option<std::path::PathBuf> {\n    let executable_pth = source.with_extension("_pth");\n    if executable_pth.is_file() {\n        return Some(executable_pth);\n    }\n\n    let python_pth = source.parent()?.join("python._pth");\n    python_pth.is_file().then_some(python_pth)\n}\n\n#[cfg(any(windows, target_os = "macos", target_os = "linux"))]\nfn ensure_runtime_alias(source: \&Path, alias_name: \&str) -> Result<()> {\n    if source.file_name() == Some(OsStr::new(alias_name)) {\n        return Ok(());\n    }\n    let alias = source\n        .parent()\n        .with_context(|| format!("Chrys runtime alias source has no parent: {}", source.display()))?\n        .join(alias_name);\n    link_or_copy_file(source, \&alias)?;\n\n    #[cfg(windows)]\n    {\n        if let Some(source_pth) = source_pth_path(source) {\n            link_or_copy_file(\&source_pth, \&alias.with_extension("_pth"))?;\n        }\n    }\n\n    Ok(())\n}\n\n#[cfg(any(windows, target_os = "macos", target_os = "linux"))]\nfn ensure_runtime_aliases() -> Result<()> {\n    ensure_runtime_alias(\&app::python_path(), app::CHRYS_RUNTIME_EXE)?;\n    #[cfg(windows)]\n    {\n        let pythonw_path = app::pythonw_path();\n        if pythonw_path.is_file() {\n            ensure_runtime_alias(\&pythonw_path, app::CHRYS_RUNTIMEW_EXE)?;\n        }\n    }\n    Ok(())\n}\n\npub fn run_project() -> Result<()> {\n    let mut command = python_command(\&app::runtime_python_path());\n\n    #[cfg(windows)]\n    {\n        if app::is_gui() {\n            command = python_command(\&app::runtime_pythonw_path());\n        }\n    }/;
              s/\n    FileExt::unlock\(\&lock_file\)/\n    #[cfg(any(windows, target_os = "macos", target_os = "linux"))]\n    ensure_runtime_aliases()?;\n\n    FileExt::unlock(\&lock_file)/;
            ' src/distribution.rs
            if ! grep -E 'CHRYS_RUNTIME_EXE|CHRYS_RUNTIMEW_EXE' src/app.rs >/dev/null \
              || ! grep -E 'target_os = "macos"' src/app.rs >/dev/null \
              || ! grep -E 'target_os = "linux"' src/app.rs >/dev/null \
              || ! grep -E 'ensure_runtime_aliases' src/distribution.rs >/dev/null \
              || ! grep -E 'runtime_python_path' src/distribution.rs >/dev/null \
              || ! grep -E 'source_pth_path' src/distribution.rs >/dev/null \
              || ! grep -E 'fs::hard_link' src/distribution.rs >/dev/null \
              || ! perl -0ne 'exit(/install_project\(\)\?;.*ensure_runtime_aliases\(\)\?;/s ? 0 : 1)' src/distribution.rs \
              || ! perl -0ne 'exit(/ensure_runtime_aliases\(\)\?;.*FileExt::unlock\(\&lock_file\)/s ? 0 : 1)' src/distribution.rs; then
              echo "::error::failed to patch PyApp runtime aliases"
              exit 1
            fi
          fi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PyApp source (and its Cargo.lock) is fetched in the previous step,
          # so the cache key reflects the pinned dependency tree. Scope by
          # target triple so the parallel matrix jobs don't clobber each other.
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Resolve Python distribution
        shell: bash
        run: |
          # The CPython .python-version pins (the one CI tests on), from the
          # python-build-standalone release pinned above, rather than the one
          # PyApp's build.rs names.
          #
          # Linux always takes the glibc build.  The musl Rust target makes the
          # launcher itself dependency-free, but python-build-standalone's musl
          # distribution is dynamically linked against musl (PT_INTERP
          # /lib/ld-musl-x86_64.so.1), so it runs on Alpine and nowhere else;
          # its statically linked +static variant cannot dlopen extension
          # modules at all.  The glibc distribution only needs GLIBC_2.17 —
          # CentOS 7 and Ubuntu 14.04 era.  The "Build offline distribution"
          # step below enforces the advertised floor (2.17, or the matrix
          # glibc_floor override) over every ELF object that lands in the
          # bundle and fails the leg on any excess.
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)  triple="x86_64-unknown-linux-gnu" ;;
            aarch64-unknown-linux-musl) triple="aarch64-unknown-linux-gnu" ;;
            *)                          triple="${{ matrix.target }}" ;;
          esac
          python_version=$(tr -d '[:space:]' < repo/.python-version)
          if ! [[ "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.python-version must pin a full CPython version, got '${python_version}'"
            exit 1
          fi
          echo "PYAPP_PYTHON_VERSION=${python_version%.*}" >> "$GITHUB_ENV"
          release="$PYTHON_BUILD_STANDALONE_RELEASE"
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${release}/cpython-${python_version}+${release}-${triple}-install_only_stripped.tar.gz"
          echo "CHRYS_DIST_URL=$url" >> "$GITHUB_ENV"
          echo "Python distribution: $url"
          if [ "${{ matrix.installer }}" != "offline" ]; then
            # Offline builds embed the distribution as a file instead, and
            # build.rs panics if a path and a source are both set.
            echo "PYAPP_DISTRIBUTION_SOURCE=$url" >> "$GITHUB_ENV"
          fi

      - name: Resolve wheel filename
        id: wheel
        shell: bash
        run: echo "filename=$(ls *.whl)" >> "$GITHUB_OUTPUT"

      - name: Prepare source builds (Windows on Arm)
        # PyPI has no Windows Arm64 wheels for cryptography, grpcio,
        # setproctitle and watchdog, so the offline distribution builds them
        # from their locked sdists; all but cryptography need nothing beyond the
        # image's MSVC. cryptography links OpenSSL statically, as its own wheels
        # do, from a build vcpkg makes here out of a pinned vcpkg commit's port,
        # not the image's vcpkg, whose ports move with every runner update.
        # uv builds each sdist inside its cache, and cl.exe cannot write a path
        # longer than 260 characters: under setup-uv's cache in RUNNER_TEMP the
        # deepest grpcio object file takes 263, so the cache moves to the drive
        # root, where it takes 243.
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        env:
          VCPKG_COMMIT: e182cb4dd2df2ab02f66a1aabd5f35bbdc9522c7 # OpenSSL 3.6.5
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init --quiet $vcpkg
          git -C $vcpkg fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "could not fetch vcpkg $env:VCPKG_COMMIT" }
          git -C $vcpkg checkout --quiet FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "could not check out vcpkg $env:VCPKG_COMMIT" }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "could not bootstrap vcpkg" }
          & "$vcpkg\vcpkg.exe" install "--vcpkg-root=$vcpkg" openssl:arm64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw "vcpkg could not build OpenSSL" }
          $openssl = Join-Path $vcpkg "installed\arm64-windows-static-md"
          "OPENSSL_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $uvCache = Join-Path (Split-Path $env:RUNNER_TEMP -Qualifier) "\uv"
          "UV_CACHE_DIR=$uvCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build offline distribution
        if: matrix.installer == 'offline'
        shell: bash
        env:
          # aarch64 carries a 2.18 floor: ripgrep publishes no static musl
          # build for it and the gnu binary needs GLIBC_2.18.  Unset legs use
          # the script default (2.17).
          OFFLINE_GLIBC_FLOOR: ${{ matrix.glibc_floor || '' }}
        run: |
          repo/scripts/build_offline_dist.sh \
            --dist-url "$CHRYS_DIST_URL" \
            --wheel "$PWD/${{ steps.wheel.outputs.filename }}" \
            --output "$PWD/chrys-offline-dist.tar.gz"
          # PYAPP_DISTRIBUTION_PATH embeds the archive as-is and PYAPP_SKIP_INSTALL
          # reduces the first run to unpacking it.  The interpreter and
          # site-packages paths are relative to PATH_PREFIX, which build.rs
          # prepends for us.
          {
            echo "PYAPP_DISTRIBUTION_PATH=chrys-offline-dist.tar.gz"
            echo "PYAPP_DISTRIBUTION_PATH_PREFIX=python"
            echo "PYAPP_SKIP_INSTALL=true"
            if [ "${{ matrix.platform }}" = "windows" ]; then
              echo "PYAPP_DISTRIBUTION_PYTHON_PATH=python.exe"
              echo "PYAPP_DISTRIBUTION_SITE_PACKAGES_PATH=Lib/site-packages"
            else
              echo "PYAPP_DISTRIBUTION_PYTHON_PATH=bin/python3"
              echo "PYAPP_DISTRIBUTION_SITE_PACKAGES_PATH=lib/python${PYAPP_PYTHON_VERSION}/site-packages"
            fi
          } >> "$GITHUB_ENV"

      # AIxCoding branding: release command artifacts
      - name: Determine binary and artifact names
        id: name
        shell: bash
        run: |
          base="${{ matrix.artifact }}"
          version="v${PROJECT_VERSION}"
          if [[ "$base" == *.exe ]]; then
            echo "binary=aixcoding-cli.exe" >> "$GITHUB_OUTPUT"
            echo "artifact=${base%.exe}-${version}-${{ matrix.installer }}" >> "$GITHUB_OUTPUT"
          else
            echo "binary=aixcoding-cli" >> "$GITHUB_OUTPUT"
            echo "artifact=${base}-${version}-${{ matrix.installer }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        shell: bash
        env:
          PYAPP_PROJECT_NAME: chrys
          PYAPP_PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
          PYAPP_EXEC_SPEC: "chrys.app.cli.app:pyapp_main"
          # iCode has its own upgrade and uninstall paths, so PyApp's `self` commands
          # (update, remove, restore, ...) stay hidden: `none` names them with a random
          # string nobody types.
          PYAPP_SELF_COMMAND: "none"
          PYAPP_PASS_LOCATION: "true"
          # FULL_ISOLATION runs the unpacked interpreter directly instead of
          # building a virtualenv around it — required for the offline flavor,
          # where the bundled site-packages is the one that must be used.
          PYAPP_FULL_ISOLATION: ${{ matrix.installer != 'uv' && 'true' || '' }}
          # The offline flavor gets its distribution options from the step above.
          # These embed the wheel and install its dependencies on first run.
          PYAPP_PROJECT_PATH: ${{ matrix.installer != 'offline' && steps.wheel.outputs.filename || '' }}
          PYAPP_PIP_ALLOW_CONFIG: ${{ matrix.installer != 'offline' && 'true' || '' }}
          PYAPP_DISTRIBUTION_EMBED: ${{ matrix.installer != 'offline' && 'true' || '' }}
          PYAPP_UV_ENABLED: ${{ matrix.installer == 'uv' && 'true' || '' }}
          PYAPP_DISTRIBUTION_PIP_AVAILABLE: ${{ matrix.installer == 'pip' && 'true' || '' }}
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/pyapp"
          [[ "${{ matrix.target }}" == *windows* ]] && src="${src}.exe"
          cp "$src" "${{ steps.name.outputs.binary }}"

      - name: Smoke test without network
        if: matrix.installer == 'offline'
        shell: bash
        env:
          # Point every proxy at a closed port: anything that reaches for the
          # network fails loudly instead of silently working on the runner.
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: |
          binary="./${{ steps.name.outputs.binary }}"
          echo "--- first run (unpacks the bundled distribution) ---"
          time "$binary" --version
          echo "--- warm run ---"
          time "$binary" --version
          "$binary" serve --help > /dev/null
          "$binary" acp --help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ steps.name.outputs.binary }}

  # ── Publish the wheel to PyPI (release tags, main repository only) ──
  # Trusted Publishing: PyPI accepts this job's OIDC token because the
  # iCode-TUI publisher names this repository, cd.yml and the `pypi`
  # environment, so no password or API token is stored anywhere. That
  # environment admits only runs on a v* tag, as tag-release dispatches them;
  # a release dispatched from a branch builds everything else but skips this.
  # Uploading a version PyPI already has fails instead of being skipped. The
  # binaries are not waited for: a failed one holds back only the GitHub
  # release.
  publish-pypi:
    name: Publish to PyPI
    if: github.repository == 'openJiuwen-ai/iCode' && startsWith(github.ref, 'refs/tags/v')
    needs: build-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/iCode-TUI/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ── Create GitHub Release (release tags only) ───────────────────────
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v')
    needs: [build-wheel, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir release
          # AIxCoding branding: release command artifacts
          # Archive binaries: tar.gz for Linux/macOS, zip for Windows
          # Binary inside the archive is "aixcoding-cli" (or "aixcoding-cli.exe");
          # the archive filename carries the platform/arch/installer info.
          for dir in artifacts/aixcoding-cli-*/; do
            [ -d "$dir" ] || continue
            artifact=$(basename "$dir")
            if [ -f "$dir/aixcoding-cli.exe" ]; then
              (cd "$dir" && zip -q "$OLDPWD/release/${artifact}.zip" "aixcoding-cli.exe")
            elif [ -f "$dir/aixcoding-cli" ]; then
              tar -czf "release/${artifact}.tar.gz" -C "$dir" "aixcoding-cli"
            fi
          done
          cp artifacts/wheel/*.whl release/
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.ref || github.ref_name }}
          generate_release_notes: true
          files: release/*

  # ── Install the release the way users do ────────────────────────────
  # The install scripts at the release tag download the packages just published, check them
  # against SHA256SUMS.txt and run `aixcoding-cli install`. GitCode gets its copy by hand later, so only
  # GitHub is tried here.
  install-scripts:
    name: Install script (${{ matrix.os }})
    needs: release
    # The scripts download from openJiuwen-ai/iCode, whose release a fork's run did not make.
    if: github.repository == 'openJiuwen-ai/iCode' && (inputs.platform || 'all') == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: scripts

      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/install.sh --version "$TAG" --source github
          # AIxCoding branding: release command artifacts
          installed=$("$HOME/.local/bin/aixcoding-cli" --version)
          echo "installed: $installed"
          test "$installed" = "${TAG#v}"

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ICODE_VERSION: ${{ env.TAG }}
          ICODE_SOURCE: github
        run: |
          # As `irm | iex` runs it: in Windows PowerShell 5.1, under its default policy.
          powershell -NoProfile -ExecutionPolicy Restricted -Command "Get-Content -Raw scripts/install.ps1 | Invoke-Expression"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed (exit code $LASTEXITCODE)." }
          $installed = & (Join-Path $env:LOCALAPPDATA 'chrys\bin\aixcoding-cli.exe') --version
          Write-Host "installed: $installed"
          if ($installed -ne $env:TAG.TrimStart('v')) { throw "Expected $env:TAG." }
