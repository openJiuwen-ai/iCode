name: Tag Release

on:
  # No `paths` filter: the mirror's force push described below changes no files.
  # A version bump is still found by comparing with the first parent.
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create version tag
    # The GitCode→GitHub mirror may first merge a PR through GitHub, a merge commit
    # GitHub makes, and seconds later force-push main to GitCode's own merge commit
    # with the same tree. Skip the commit GitHub made and tag the one the mirror
    # leaves on main, so the GitHub and GitCode tags name the same commit.
    if: github.event.head_commit.committer.email != 'noreply@github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          current=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          previous=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep -m1 '^version' | sed 's/version = "\(.*\)"/\1/' || echo "")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ] && [ -n "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $previous → $current"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($current), skipping tag"
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="v${{ steps.version.outputs.current }}"
          if git ls-remote --tags origin "$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists, skipping"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Created tag: $tag"

      # CD runs only when dispatched, so dispatch it on the tag pushed above: a run
      # on a release tag is the only kind the `pypi` environment lets publish to
      # PyPI, and `ref` makes it build that tag. A tag CD already ran on is not
      # dispatched again: the mirror can force-push main back to a released commit.
      - name: Trigger CD pipeline
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="v${{ steps.version.outputs.current }}"
          # A failed lookup fails this step (bash -e) instead of dispatching.
          runs=$(gh run list --workflow cd.yml --branch "$tag" --limit 1 --json databaseId --jq '.[].databaseId')
          if [ -n "$runs" ]; then
            echo "CD already ran on $tag, skipping"
            exit 0
          fi
          gh workflow run cd.yml --ref "$tag" -f ref="$tag"
        env:
          GH_TOKEN: ${{ github.token }}
