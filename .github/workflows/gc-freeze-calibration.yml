name: GC freeze calibration

on:
  workflow_dispatch:
  schedule:
    # Daily off-peak run; also covers the slow ``gc_calibration``-marked
    # real-App probes that PR CI deselects.
    - cron: "17 9 * * *"
  pull_request:
    branches: [main]
    # Changes to the calibration machinery itself get a pre-merge run;
    # workflow_dispatch cannot target a workflow file that is not on the
    # default branch yet, so this is also the only way to exercise edits
    # to this workflow before merging.
    paths:
      - ".github/workflows/gc-freeze-calibration.yml"
      - "scripts/calibrate_gc_freeze.py"
      - "scripts/chat_panel_workloads.py"
      - "scripts/gc_freeze_calibration_math.py"
      - "scripts/profile_chat_panel.py"
      - "src/chrys/app/tui/support/gc_freeze.py"
      - "tests/app/tui/support/test_gc_freeze_calibration.py"

concurrency:
  group: gc-freeze-calibration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calibrate:
    name: Whole-App GC freeze calibration
    runs-on: ubuntu-latest
    # First CI run measured 12m07s wall (probes 43s + script 11m08s);
    # 15min left <3min headroom on an already-noisy shared runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - run: uv sync
      # Calibration must run serially and alone: concurrent suites contend for
      # CPU and skew the frozen_collect_ratio / latency gates.
      - name: Run gc_calibration test probes
        run: uv run pytest -q --tb=short -n 0 -m "gc_calibration"
      - name: Run whole-App calibration
        run: uv run python scripts/calibrate_gc_freeze.py --turns 12
