name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      build_ref:
        description: 'Release ref to validate; empty uses the triggering ref'
        type: string
        default: ''

concurrency:
  group: ci-${{ inputs.build_ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - run: uv sync
      - run: uv run ruff check src/ tests/ scripts/chrys_test.py scripts/check_wheel.py scripts/calibrate_gc_freeze.py scripts/gc_freeze_calibration_math.py scripts/chat_panel_workloads.py hatch_build.py scripts/i18n_mo.py
      - run: uv run ruff format --check src/ tests/ scripts/chrys_test.py scripts/check_wheel.py scripts/calibrate_gc_freeze.py scripts/gc_freeze_calibration_math.py scripts/chat_panel_workloads.py hatch_build.py scripts/i18n_mo.py

  test_linux:
    name: Unix shard (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/core
            artifact: linux
            os: linux
            workers: 4
            pytest_args: tests --ignore=tests/architecture --ignore=tests/app/tui
          # The TUI suite fills two runners, cut the same on every platform at
          # a measured, roughly even point: the main screen's, behaviors',
          # themes', settings' and terminal tests weigh as much as the rest.
          # The second shard takes everything the first does not name. Move
          # the cut by the shards' JUnit times when one nears the step limit.
          - label: linux/1/tui
            artifact: linux-tui-1
            os: linux
            workers: 4
            pytest_args: >-
              tests/app/tui/screens/main tests/app/tui/behaviors
              tests/app/tui/screens/themes tests/app/tui/screens/settings
              tests/app/tui/terminal
          - label: linux/2/tui
            artifact: linux-tui-2
            os: linux
            workers: 4
            pytest_args: >-
              tests/app/tui --ignore=tests/app/tui/screens/main
              --ignore=tests/app/tui/behaviors
              --ignore=tests/app/tui/screens/themes
              --ignore=tests/app/tui/screens/settings
              --ignore=tests/app/tui/terminal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - name: Install Python 3.9
        # The oldest interpreter a workflow worker may run in. uv's standalone
        # builds do not depend on the runner image; setup-python's manifest
        # has no 3.9 for newer Ubuntu images, which ubuntu-latest moves to.
        run: |
          uv python install 3.9
          echo "CHRYS_PY39_INTERPRETER=$(uv python find 3.9)" >> "$GITHUB_ENV"
      - run: uv sync
      - name: Prewarm src bytecode
        run: uv run python -m compileall -q src
      - name: Prewarm test collection
        # Measured on #553: cuts the test step ~90-100s on Linux/Windows, but
        # costs ~27s on macOS with no test-step payback — skip it there.
        if: matrix.os != 'macos'
        run: uv run pytest --collect-only -q -n 0 -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Fetch ripgrep binary
        run: ./scripts/fetch_rg.sh
      # ``gc_calibration`` tests are slow real-App probes covered by the
      # scheduled gc-freeze-calibration workflow, not PR CI.
      - name: Run tests
        timeout-minutes: 15
        env:
          CHRYS_TEST_STALL_DIAGNOSTICS: "1"
        run: uv run pytest -q --tb=short --durations=20 --dist=worksteal --junitxml=test-results-${{ matrix.artifact }}.xml -n ${{ matrix.workers }} -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Typecheck (ty)
        # Keep test and type diagnostics independent; run once after tests,
        # even if they failed, but stop when the workflow is cancelled. A
        # platform's extra core shards opt out, so the check runs once.
        if: ${{ !cancelled() && !endsWith(matrix.label, '/tui') && !matrix.skip_typecheck }}
        run: uv run ty check --error-on-warning src/chrys
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results-${{ matrix.artifact }}.xml

  test_macos:
    name: Unix shard (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos/core
            artifact: macos
            os: macos
            workers: 6
            pytest_args: tests --ignore=tests/architecture --ignore=tests/app/tui
          # The same TUI cut as Linux and Windows (see test_linux).
          - label: macos/1/tui
            artifact: macos-tui-1
            os: macos
            workers: 6
            pytest_args: >-
              tests/app/tui/screens/main tests/app/tui/behaviors
              tests/app/tui/screens/themes tests/app/tui/screens/settings
              tests/app/tui/terminal
          - label: macos/2/tui
            artifact: macos-tui-2
            os: macos
            workers: 6
            pytest_args: >-
              tests/app/tui --ignore=tests/app/tui/screens/main
              --ignore=tests/app/tui/behaviors
              --ignore=tests/app/tui/screens/themes
              --ignore=tests/app/tui/screens/settings
              --ignore=tests/app/tui/terminal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - run: uv sync
      - name: Prewarm src bytecode
        run: uv run python -m compileall -q src
      - name: Prewarm test collection
        # Measured on #553: cuts the test step ~90-100s on Linux/Windows, but
        # costs ~27s on macOS with no test-step payback — skip it there.
        if: matrix.os != 'macos'
        run: uv run pytest --collect-only -q -n 0 -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Fetch ripgrep binary
        run: ./scripts/fetch_rg.sh
      # ``gc_calibration`` tests are slow real-App probes covered by the
      # scheduled gc-freeze-calibration workflow, not PR CI.
      - name: Run tests
        timeout-minutes: 15
        env:
          CHRYS_TEST_STALL_DIAGNOSTICS: "1"
        run: uv run pytest -q --tb=short --durations=20 --dist=worksteal --junitxml=test-results-${{ matrix.artifact }}.xml -n ${{ matrix.workers }} -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Typecheck (ty)
        # Keep test and type diagnostics independent; run once after tests,
        # even if they failed, but stop when the workflow is cancelled. A
        # platform's extra core shards opt out, so the check runs once.
        if: ${{ !cancelled() && !endsWith(matrix.label, '/tui') && !matrix.skip_typecheck }}
        run: uv run ty check --error-on-warning src/chrys
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results-${{ matrix.artifact }}.xml

  test_windows:
    name: Windows shard (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core suite fits one four-vCPU runner; the TUI suite takes the
          # same cut as Linux and macOS (see test_linux).
          - label: windows/core
            artifact: windows-core
            workers: 4
            py39: true
            pytest_args: tests --ignore=tests/architecture --ignore=tests/app/tui
          - label: windows/1/tui
            artifact: windows-tui-1
            workers: 4
            py39: false
            pytest_args: >-
              tests/app/tui/screens/main tests/app/tui/behaviors
              tests/app/tui/screens/themes tests/app/tui/screens/settings
              tests/app/tui/terminal
          - label: windows/2/tui
            artifact: windows-tui-2
            workers: 4
            py39: false
            pytest_args: >-
              tests/app/tui --ignore=tests/app/tui/screens/main
              --ignore=tests/app/tui/behaviors
              --ignore=tests/app/tui/screens/themes
              --ignore=tests/app/tui/screens/settings
              --ignore=tests/app/tui/terminal
    steps:
      # Hosted Windows images already disable real-time Defender scanning, so
      # changing Defender settings here is a measured no-op.
      - name: Keep temporary files on the local disk
        # TEMP defaults to C:, the runner's network-backed OS disk; D: is its
        # local temporary storage. Every test's tmp_path, session store and
        # scratch repository lives under TEMP, and the suite's create, fsync
        # and remove churn measured 6-10x faster on D:.
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - name: Install Python 3.9
        # The oldest interpreter a workflow worker may run in; only the core
        # suite spawns one. uv puts it on D: in seconds, where setup-python
        # spent ~45s installing into the C: tool cache.
        if: matrix.py39
        run: |
          uv python install 3.9
          "CHRYS_PY39_INTERPRETER=$(uv python find 3.9)" >> $env:GITHUB_ENV
      - name: Cache .venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version', 'uv.lock', 'pyproject.toml') }}
      - run: uv sync
      - name: Prewarm src bytecode
        run: uv run python -m compileall -q src
      - name: Prewarm test collection
        run: uv run pytest --collect-only -q -n 0 -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Fetch ripgrep binary
        run: .\scripts\fetch_rg.ps1
      # pytest-timeout's thread method can fail to kill workers blocked in
      # Windows IOCP, so the step also has a hard wall-clock limit.
      - name: Run tests
        timeout-minutes: 15
        env:
          CHRYS_TEST_STALL_DIAGNOSTICS: "1"
        # Separate runners give the TUI and core suites independent CPU
        # capacity; four workers also overlap their async and IO waits.
        run: uv run pytest -q --tb=short --durations=20 --dist=worksteal --junitxml=test-results-${{ matrix.artifact }}.xml -n ${{ matrix.workers }} -m "not integration and not gc_calibration" ${{ matrix.pytest_args }}
      - name: Typecheck (ty)
        # Keep test and type diagnostics independent; run once after tests,
        # even if they failed, but stop when the workflow is cancelled. A
        # platform's extra core shards opt out, so the check runs once.
        if: ${{ !cancelled() && !endsWith(matrix.label, '/tui') && !matrix.skip_typecheck }}
        run: uv run ty check --error-on-warning src/chrys
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results-${{ matrix.artifact }}.xml

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - run: uv sync
      - name: Run architecture tests
        timeout-minutes: 15
        run: uv run pytest -q --tb=short --durations=20 --junitxml=test-results-architecture.xml -n 0 -m "not integration and not gc_calibration" tests/architecture
      - name: Upload architecture test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-architecture
          path: test-results-architecture.xml

  test_linux_gate:
    name: Test (linux)
    if: always()
    needs: [test_linux, architecture]
    runs-on: ubuntu-slim
    steps:
      - name: Verify linux shards and architecture tests
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          PLATFORM_RESULT: ${{ needs.test_linux.result }}
        run: |
          test "$PLATFORM_RESULT" = "success"
          test "$ARCHITECTURE_RESULT" = "success"

  test_macos_gate:
    name: Test (macos)
    if: always()
    needs: [test_macos, architecture]
    runs-on: ubuntu-slim
    steps:
      - name: Verify macos shards and architecture tests
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          PLATFORM_RESULT: ${{ needs.test_macos.result }}
        run: |
          test "$PLATFORM_RESULT" = "success"
          test "$ARCHITECTURE_RESULT" = "success"

  test_windows_gate:
    name: Test (windows)
    if: always()
    needs: [test_windows, architecture]
    runs-on: ubuntu-slim
    steps:
      - name: Verify Windows shards and architecture tests
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          WINDOWS_RESULT: ${{ needs.test_windows.result }}
        run: |
          test "$WINDOWS_RESULT" = "success"
          test "$ARCHITECTURE_RESULT" = "success"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      # Built as CD builds the released wheel, with every platform's ripgrep.
      - name: Fetch ripgrep binaries (all platforms)
        run: ./scripts/fetch_rg.sh --all
      - run: uv build
      - name: Install and run the wheel as a PyPI user would
        run: python scripts/check_wheel.py --all-ripgrep dist/icode_tui-*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  wheel_install:
    name: Install wheel (${{ matrix.label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds one dependency from source during the install.
          - label: macos
            os: macos-latest
          - label: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install and run the wheel as a PyPI user would
        shell: bash
        run: python scripts/check_wheel.py dist/icode_tui-*.whl
