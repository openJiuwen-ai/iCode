name: Ripgrep cache warmer

# PR caches live in the PR's own scope: ci.yml never runs on the default branch
# (only on pull_request and via cd's workflow_call), so nothing there would ever
# save the ripgrep entries every PR restores from. This workflow keeps them warm
# under refs/heads/main: when the fetch scripts change (the only input the keys
# hash), weekly against GitHub's seven-day unused-entry eviction, and on demand.
# A pull_request trigger exercises edits before merge, as gc-freeze-calibration
# does — a PR-scoped save is isolated and harmless.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/fetch_rg.sh"
      - "scripts/fetch_rg.ps1"
      - ".github/workflows/rg-cache-warmer.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/fetch_rg.sh"
      - "scripts/fetch_rg.ps1"
      - ".github/workflows/rg-cache-warmer.yml"

permissions:
  contents: read

jobs:
  host:
    name: Warm host binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The shard jobs' runners, so each key this warms is the one that shard restores.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the vendored ripgrep binary
        id: rg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/chrys/foundation/vendor/ripgrep
          key: ripgrep-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch_rg.sh', 'scripts/fetch_rg.ps1') }}
      - name: Fetch ripgrep binary
        if: steps.rg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then pwsh -NoProfile -File scripts/fetch_rg.ps1
          else ./scripts/fetch_rg.sh
          fi

  all:
    name: Warm every platform's binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the vendored ripgrep binaries
        id: rg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/chrys/foundation/vendor/ripgrep
          key: ripgrep-all-${{ hashFiles('scripts/fetch_rg.sh', 'scripts/fetch_rg.ps1') }}
      - name: Fetch ripgrep binaries (all platforms)
        if: steps.rg.outputs.cache-hit != 'true'
        run: ./scripts/fetch_rg.sh --all
