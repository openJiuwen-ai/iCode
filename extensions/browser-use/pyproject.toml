[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-use"
version = "0.3.3"
description = "Browser automation for iCode: a stdlib-only CDP core and a Python extension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
keywords = ["browser", "cdp", "chrome-devtools-protocol", "icode", "chrys"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
browser-use = "browser_use.cli:main"
browser-use-host = "browser_use.bridge.host:main"
browser-use-bridge = "browser_use.bridge.install:main"
browser-use-broker = "browser_use.broker:main"

[project.entry-points."chrys.extensions"]
browser = "browser_use.extension:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_use"]

[dependency-groups]
dev = ["pytest>=8", "iCode-TUI; python_full_version >= '3.14'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
