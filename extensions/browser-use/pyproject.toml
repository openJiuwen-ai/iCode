[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icode-browser-use"
version = "0.3.3"
description = "Browser automation for iCode: a stdlib-only CDP core and a Python extension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
keywords = ["browser", "cdp", "chrome-devtools-protocol", "icode", "chrys"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
icode-browser-use = "icode_browser_use.cli:main"
icode-browser-use-host = "icode_browser_use.bridge.host:main"
icode-browser-use-bridge = "icode_browser_use.bridge.install:main"
icode-browser-use-broker = "icode_browser_use.broker:main"

[project.entry-points."chrys.extensions"]
browser = "icode_browser_use.extension:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/icode_browser_use"]
exclude = [
  "src/icode_browser_use/extension/*.test.js",
  "src/icode_browser_use/extension/package.json",
]

[dependency-groups]
dev = ["pytest>=8", "iCode-TUI; python_full_version >= '3.14'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "B", "E9", "PLE", "ASYNC", "RUF006", "S"]
ignore = ["ASYNC109", "ASYNC240", "S101", "S105", "S106", "S108", "S110", "S112", "S310", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "ASYNC"]
"**/scripts/**" = ["S", "ASYNC"]
