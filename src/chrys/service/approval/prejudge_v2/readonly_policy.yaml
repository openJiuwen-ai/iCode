# Built-in policy data evaluated by Tree-sitter + the same YAML matcher engine.
# The old read-only checker is NOT called by this policy.
schema_version: 1
policy_id: builtin-readonly-v1
guard:
  all:
    - args_none_of: ["-delete","--delete","rm","rmdir","mv","cp","mkdir","touch","chmod","chown","chgrp","ln","tee","kill","pkill","killall","dd","shred","truncate","mkfs","Remove-Item","Move-Item","Copy-Item","Rename-Item","New-Item","Set-Content","Add-Content","Clear-Content","Out-File","Stop-Process","Start-Process","Invoke-Expression","Invoke-Command"]
    - env_names_allowed: ["CLICOLOR","CLICOLOR_FORCE","LANG","LANGUAGE","NO_COLOR","TERM","TZ","LC_*"]
rules:
  - id: readonly-command-set
    effect: allow
    target: command
    match:
      command_in: ["ls","tree","pwd","cd","realpath","readlink","basename","dirname","cat","tac","head","tail","less","more","wc","stat","grep","rg","cut","tr","diff","comm","uname","whoami","date","printenv","which","type","id","hostname","ps","df","du","free","uptime","arch","md5sum","sha256sum","shasum","echo","printf","true","false","test","expr","seq","jq","dir","fc","findstr","ver","where","Compare-Object","Get-ChildItem","Get-Content","Get-Item","Get-ItemProperty","Get-Location","Get-Module","Get-PSDrive","Get-Process","Get-Service","Get-Command","Get-Help","Get-Alias","Get-Date","Get-Host","Get-Variable","Get-Member","Test-Path","Resolve-Path","Split-Path","Join-Path","Select-String","Select-Object","Where-Object","Sort-Object","Group-Object","Measure-Object","Out-String","Out-Null","Format-Table","Format-List","ConvertFrom-Json","ConvertTo-Json","Write-Output","Write-Host"]
  - id: exact-version-help
    effect: allow
    target: command
    match:
      argv_in: [["cargo","--version"],["cargo","-V"],["cargo","--help"],["cargo","-h"],["cargo","help"],["cargo","version"],["curl","--version"],["curl","-V"],["curl","--help"],["curl","-h"],["dotnet","--version"],["dotnet","--info"],["dotnet","--list-sdks"],["dotnet","--list-runtimes"],["dotnet","--help"],["dotnet","-h"],["go","version"],["go","help"],["java","-version"],["java","--version"],["java","-help"],["java","--help"],["java","-h"],["mypy","--version"],["mypy","-V"],["mypy","--help"],["mypy","-h"],["node","--version"],["node","-v"],["node","--help"],["node","-h"],["npm","--version"],["npm","-v"],["npm","--help"],["npm","-h"],["npx","--version"],["npx","-v"],["npx","--help"],["npx","-h"],["pip","--version"],["pip","-V"],["pip","--help"],["pip","-h"],["pip3","--version"],["pip3","-V"],["pip3","--help"],["pip3","-h"],["pytest","--version"],["pytest","--help"],["pytest","-h"],["python","--version"],["python","-V"],["python","--help"],["python","-h"],["python3","--version"],["python3","-V"],["python3","--help"],["python3","-h"],["ruby","--version"],["ruby","-v"],["ruby","--help"],["ruby","-h"],["ruff","--version"],["ruff","-V"],["ruff","--help"],["ruff","-h"],["uv","--version"],["uv","-V"],["uv","--help"],["uv","-h"],["wget","--version"],["wget","-V"],["wget","--help"],["wget","-h"],["yq","--version"],["yq","-V"],["yq","--help"],["yq","-h"]]
  - id: git-status
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"status","require_globals":["--no-optional-locks"],"flags":["--short","-s","--branch","-b","--porcelain","--porcelain=v1","--porcelain=v2","--untracked-files","--untracked-files=all","--untracked-files=normal","--untracked-files=no","--ignored","--ignored=traditional","--ignored=matching","--ignored=no","--no-renames","--renames"]}
  - id: git-diff
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"diff","flags":["--no-ext-diff","--no-textconv","-p","-u","--patch","--patch-with-raw","--patch-with-stat","--cc","-c","--combined","--stat","--numstat","--shortstat","--name-only","--name-status","--cached","--staged","--exit-code","--quiet"],"flag_prefixes":["--patch=","-U","--unified="],"require_flags":["--no-ext-diff","--no-textconv"]}
  - id: git-show
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"show","flags":["--no-ext-diff","--no-textconv","-p","-u","--patch","--patch-with-raw","--patch-with-stat","--cc","-c","--combined","--stat","--numstat","--shortstat","--name-only","--name-status","--cached","--staged","--exit-code","--quiet","--format=oneline"],"flag_prefixes":["--patch=","-U","--unified="],"require_flags":["--no-ext-diff","--no-textconv"]}
  - id: git-log-simple
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"log","flags":["--oneline","--graph","--decorate","--no-decorate","--stat","--numstat","--shortstat","--name-only","--name-status","--no-ext-diff","--no-textconv"],"short_patterns":["-\\d+"]}
  - id: git-log-patch
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"log","flags":["--oneline","--graph","--decorate","--no-decorate","--stat","--numstat","--shortstat","--name-only","--name-status","--no-ext-diff","--no-textconv","--no-ext-diff","--no-textconv","-p","-u","--patch","--patch-with-raw","--patch-with-stat","--cc","-c","--combined","--stat","--numstat","--shortstat","--name-only","--name-status","--cached","--staged","--exit-code","--quiet"],"flag_prefixes":["--patch=","-U","--unified="],"short_patterns":["-\\d+"],"require_flags":["--no-ext-diff","--no-textconv"]}
  - id: git-grep
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"grep","flags":["-n","--line-number","-i","-I","-l","--files-with-matches","-L","--files-without-match","-c","--count","--cached","--untracked"],"short_clusters":"niIlLc"}
  - id: git-cat-file
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"cat-file","flags":["-e","-p","-s","-t"]}
  - id: git-query-subcommands
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand_in":["check-attr","check-ignore","check-mailmap","describe","for-each-ref","ls-files","ls-tree","merge-base","name-rev","rev-list","rev-parse","show-branch","show-ref"],"allow_any_options":true}
  - id: git-remote
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"remote","subargs_in":[[],["-v"],["--verbose"]]}
  - id: git-worktree
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"worktree","subargs_in":[["list"]]}
  - id: git-stash-list
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"stash","subargs_in":[["list"],["list","--stat"]]}
  - id: git-stash-show
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"stash","subargs_prefix":["show"],"flags":["--stat"]}
  - id: git-stash-show-patch
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"stash","subargs_prefix":["show"],"flags":["--stat","-p","--patch","--no-ext-diff","--no-textconv"],"require_flags":["--no-ext-diff","--no-textconv"]}
  - id: git-branch
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"branch","flags":["-a","--all","-r","--remotes","-v","-vv","--verbose","--list","--show-current","--no-color","--color"],"value_flags":["--format","--sort","--points-at","--contains","--no-contains","--merged","--no-merged"],"flag_prefixes":["--format=","--sort=","--points-at=","--contains=","--no-contains=","--merged=","--no-merged=","--color="],"positionals_with_flag":["--list","--show-current","-a","--all","-r","--remotes"]}
  - id: git-tag
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"tag","flags":["--list","-l","-n","--no-color","--color","--sort","--format"],"value_flags":["--format","--sort","--points-at","--contains","--no-contains"],"flag_prefixes":["--format=","--sort=","--points-at=","--contains=","--no-contains=","--color=","-n"],"positionals_with_flag":["--list","-l"]}
  - id: git-config
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"git","subcommand":"config","flags":["--get","--get-all","--get-regexp","--list","-l","--name-only","--get-color","--get-colorbool","--global","--system","--local","--worktree","--show-origin","--show-scope","-z","--null"],"require_any_flags":["--get","--get-all","--get-regexp","--list","-l","--name-only","--get-color","--get-colorbool"]}
  - id: pip-freeze
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"pip","subcommand":"freeze","allow_any_options":true}
  - id: pip-show
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"pip","subcommand":"show","allow_any_options":true}
  - id: pip-list
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"pip","subcommand":"list","allow_any_options":true,"forbid_flags":["-o","-u"],"forbid_prefixes":["--out","--upt"]}
  - id: pip3-freeze
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"pip3","subcommand":"freeze","allow_any_options":true}
  - id: pip3-show
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"pip3","subcommand":"show","allow_any_options":true}
  - id: pip3-list
    effect: allow
    target: command
    match:
      cli: {"global_flags":["--no-pager","--no-optional-locks","--literal-pathspecs","--glob-pathspecs","--noglob-pathspecs","--icase-pathspecs"],"global_values":["-C","--git-dir","--work-tree","--namespace"],"command":"pip3","subcommand":"list","allow_any_options":true,"forbid_flags":["-o","-u"],"forbid_prefixes":["--out","--upt"]}
  - id: ruff-check
    effect: allow
    target: command
    match:
      all: [{"command_in":["ruff"]},{"cli":{"command":"ruff","subcommand":"check","require_flags":["--no-cache"],"require_any_flags":["--no-fix","--diff"],"allow_any_options":true,"forbid_flags":["--fix","--fix-only","--add-noqa","--unsafe-fixes","--output-file"],"forbid_prefixes":["--fix=","--fix-only=","--add-noqa=","--unsafe-fixes=","--output-file="],"forbid_short_cluster":"o"}}]
  - id: ruff-format
    effect: allow
    target: command
    match:
      cli: {"command":"ruff","subcommand":"format","require_any_flags":["--check","--diff"],"allow_any_options":true,"forbid_flags":["--output-file"],"forbid_prefixes":["--output-file="],"forbid_short_cluster":"o"}
  - id: find-inspect
    effect: allow
    target: command
    match:
      all: [{"command_in":["find"]},{"args_none_of":["-delete","-execdir","-ok","-okdir","-fls","-fprint","-fprint0","-fprintf","-exec"]}]
  - id: env-inspect
    effect: allow
    target: command
    match:
      all: [{"command_in":["env"]},{"args_regex":"^[A-Za-z_][A-Za-z0-9_]*=.*$"}]
  - id: uniq-basic
    effect: allow
    target: command
    match:
      argv_in: [["uniq"]]
  - id: awk-field-print
    effect: allow
    target: command
    match:
      all: [{"command_in":["awk"]},{"argument_at_regex":[1,"^\\{\\s*print\\s+\\$[0-9]+\\s*\\}$"]},{"args_prefix_none_of":["-"]}]
